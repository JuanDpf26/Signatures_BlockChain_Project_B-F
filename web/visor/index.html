<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Visor de documentos · DocBlockSign</title>
<style>
  :root { --azul: #0B45B5; --texto: #0F1B33; --gris: #5F6670; --borde: #E2E8F0; --fondo: #E5E7EB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); }
  #barra { position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 5; display: flex; align-items: center; gap: 6px;
           padding: 0 10px; background: #fff; border-bottom: 1px solid var(--borde); }
  #barra button { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--borde); background: #fff; border-radius: 8px;
                  color: var(--azul); font-size: 15px; font-weight: 700; cursor: pointer; }
  #barra button:active { background: #EEF3FD; }
  #pagina { font-size: 13px; color: var(--gris); font-weight: 600; white-space: nowrap; }
  #zoom { font-size: 13px; color: var(--gris); min-width: 46px; text-align: center; }
  .esp { flex: 1; }
  #hojas { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
  #contenido { transform-origin: 0 0; padding: 12px 0 24px; }
  .hoja { margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px rgba(15, 27, 51, .18); position: relative; }
  .hoja canvas { display: block; width: 100%; height: 100%; }
  #estado { position: absolute; inset: 48px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; text-align: center; padding: 24px; color: var(--gris); font-size: 14px; }
  .giro { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--borde); border-top-color: var(--azul); animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  #estado a { color: #fff; background: var(--azul); padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div id="barra">
  <button id="menos" aria-label="Alejar">−</button>
  <span id="zoom">100 %</span>
  <button id="mas" aria-label="Acercar">+</button>
  <button id="ajustar" aria-label="Ajustar al ancho">Ajustar</button>
  <span class="esp"></span>
  <span id="pagina"></span>
</div>
<div id="hojas"><div id="contenido"></div></div>
<div id="estado"><div class="giro"></div><div id="msg">Cargando documento…</div></div>

<script type="module">
  import * as pdfjs from './pdf.min.mjs';
  pdfjs.GlobalWorkerOptions.workerSrc = './pdf.worker.min.mjs';

  const archivo = new URLSearchParams(location.search).get('file');
  const hojas = document.getElementById('hojas');
  const contenido = document.getElementById('contenido');
  const estado = document.getElementById('estado');
  const msg = document.getElementById('msg');
  const lblZoom = document.getElementById('zoom');
  const lblPagina = document.getElementById('pagina');

  let doc = null;
  let base = 1;        // escala para ajustar al ancho
  let zoom = 1;        // zoom del usuario sobre el ajuste
  const paginas = [];  // { div, canvas, page, renderizada }

  const error = (texto) => {
    estado.innerHTML = '';
    const p = document.createElement('div');
    p.textContent = texto;
    estado.appendChild(p);
    if (archivo) {
      const a = document.createElement('a');
      a.href = archivo; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Abrir o descargar el archivo';
      estado.appendChild(a);
    }
    estado.style.display = 'flex';
  };

  const anchoDisponible = () => Math.max(200, hojas.clientWidth - 24);

  function medidas() {
    for (const p of paginas) {
      const vp = p.page.getViewport({ scale: base * zoom });
      p.div.style.width = `${Math.floor(vp.width)}px`;
      p.div.style.height = `${Math.floor(vp.height)}px`;
      p.renderizada = false;
    }
    lblZoom.textContent = `${Math.round(zoom * 100)} %`;
    pintarVisibles();
  }

  async function pintar(p) {
    if (p.renderizada || p.pintando) return;
    p.pintando = true;
    const escala = base * zoom;
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const vp = p.page.getViewport({ scale: escala * dpr });
    const canvas = document.createElement('canvas');
    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    try {
      await p.page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      p.div.replaceChildren(canvas);
      p.renderizada = escala === base * zoom;
    } catch (e) { /* se reintenta al volver a ser visible */ }
    p.pintando = false;
  }

  function pintarVisibles() {
    const arriba = hojas.scrollTop - 400, abajo = hojas.scrollTop + hojas.clientHeight + 400;
    let actual = 1;
    for (let i = 0; i < paginas.length; i++) {
      const d = paginas[i].div;
      const top = d.offsetTop * 1, bottom = top + d.offsetHeight;
      if (bottom > arriba && top < abajo) pintar(paginas[i]);
      if (top <= hojas.scrollTop + hojas.clientHeight / 3) actual = i + 1;
    }
    lblPagina.textContent = `Página ${actual} de ${paginas.length}`;
  }

  function fijarZoom(z) {
    const rel = hojas.scrollTop / Math.max(1, contenido.scrollHeight);
    zoom = Math.min(4, Math.max(0.5, z));
    medidas();
    hojas.scrollTop = rel * contenido.scrollHeight;
  }

  document.getElementById('mas').onclick = () => fijarZoom(zoom + 0.25);
  document.getElementById('menos').onclick = () => fijarZoom(zoom - 0.25);
  document.getElementById('ajustar').onclick = () => fijarZoom(1);
  hojas.addEventListener('scroll', () => requestAnimationFrame(pintarVisibles), { passive: true });
  window.addEventListener('resize', () => {
    if (!doc) return;
    base = anchoDisponible() / paginas[0].page.getViewport({ scale: 1 }).width;
    medidas();
  });

  // Pellizcar para hacer zoom (celular)
  let pinch = null;
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  hojas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = { d: dist(e.touches), z: zoom }; }, { passive: true });
  hojas.addEventListener('touchmove', (e) => {
    if (!pinch || e.touches.length !== 2) return;
    e.preventDefault();
    const f = dist(e.touches) / pinch.d;
    contenido.style.transform = `scale(${f})`;
    pinch.f = f;
  }, { passive: false });
  hojas.addEventListener('touchend', () => {
    if (!pinch) return;
    contenido.style.transform = '';
    if (pinch.f) fijarZoom(pinch.z * pinch.f);
    pinch = null;
  });

  async function iniciar() {
    if (!archivo) return error('No se indicó qué documento abrir.');
    try {
      doc = await pdfjs.getDocument({
        url: archivo,
        cMapUrl: './cmaps/', cMapPacked: true,
        standardFontDataUrl: './standard_fonts/',
      }).promise;
      for (let n = 1; n <= doc.numPages; n++) {
        const page = await doc.getPage(n);
        const div = document.createElement('div');
        div.className = 'hoja';
        contenido.appendChild(div);
        paginas.push({ div, page, renderizada: false });
      }
      base = anchoDisponible() / paginas[0].page.getViewport({ scale: 1 }).width;
      estado.style.display = 'none';
      medidas();
    } catch (e) {
      console.error(e);
      error('No se pudo mostrar el documento aquí.');
    }
  }
  iniciar();
</script>
</body>
</html>
