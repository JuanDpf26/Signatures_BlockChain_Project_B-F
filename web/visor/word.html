<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Visor de Word · DocBlockSign</title>
<style>
  :root { --azul: #0B45B5; --texto: #0F1B33; --gris: #5F6670; --borde: #E2E8F0; --fondo: #E5E7EB; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--fondo); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto); }
  #barra { position: fixed; top: 0; left: 0; right: 0; height: 48px; z-index: 5; display: flex; align-items: center; gap: 6px;
           padding: 0 10px; background: #fff; border-bottom: 1px solid var(--borde); }
  #barra button { height: 34px; min-width: 34px; padding: 0 10px; border: 1px solid var(--borde); background: #fff; border-radius: 8px;
                  color: var(--azul); font-size: 15px; font-weight: 700; cursor: pointer; }
  #barra button:active { background: #EEF3FD; }
  #info { font-size: 13px; color: var(--gris); font-weight: 600; white-space: nowrap; }
  #zoom { font-size: 13px; color: var(--gris); min-width: 46px; text-align: center; }
  .esp { flex: 1; }
  #hojas { position: absolute; top: 48px; left: 0; right: 0; bottom: 0; overflow: auto; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }
  #contenido { padding: 12px 0 24px; }
  /* docx-preview: cada sección es una hoja; se quita su fondo gris propio */
  #contenido .docx-wrapper { background: transparent !important; padding: 0 !important; display: flex; flex-direction: column; align-items: center; }
  #contenido .docx-wrapper > section.docx { box-shadow: 0 1px 4px rgba(15, 27, 51, .18) !important; margin: 0 auto 12px !important; }
  #estado { position: absolute; inset: 48px 0 0 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; text-align: center; padding: 24px; color: var(--gris); font-size: 14px; background: var(--fondo); }
  .giro { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--borde); border-top-color: var(--azul); animation: g 0.9s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  #estado a { color: #fff; background: var(--azul); padding: 10px 16px; border-radius: 10px; text-decoration: none; font-weight: 700; }
</style>
</head>
<body>
<div id="barra">
  <button id="menos" aria-label="Alejar">−</button>
  <span id="zoom">100 %</span>
  <button id="mas" aria-label="Acercar">+</button>
  <button id="ajustar" aria-label="Ajustar al ancho">Ajustar</button>
  <span class="esp"></span>
  <span id="info"></span>
</div>
<div id="hojas"><div id="contenido"></div></div>
<div id="estado"><div class="giro"></div><div id="msg">Cargando documento…</div></div>

<script src="./jszip.min.js"></script>
<script src="./docx-preview.min.js"></script>
<script>
  // Visor de Word propio: lee el .docx en el navegador y lo dibuja por páginas,
  // sin enviarlo a servicios externos (los archivos de DocBlockSign son privados).
  const archivo = new URLSearchParams(location.search).get('file');
  const hojas = document.getElementById('hojas');
  const contenido = document.getElementById('contenido');
  const estado = document.getElementById('estado');
  const lblZoom = document.getElementById('zoom');
  const lblInfo = document.getElementById('info');

  let base = 1;  // escala para que la hoja quepa a lo ancho
  let zoom = 1;  // zoom del usuario sobre el ajuste

  const error = (texto) => {
    estado.innerHTML = '';
    const p = document.createElement('div');
    p.textContent = texto;
    estado.appendChild(p);
    if (archivo) {
      const a = document.createElement('a');
      a.href = archivo; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = 'Descargar el archivo';
      estado.appendChild(a);
    }
    estado.style.display = 'flex';
  };

  function anchoHoja() {
    const s = contenido.querySelector('section.docx');
    return s ? s.offsetWidth : 816;
  }

  function aplicar() {
    const z = base * zoom;
    const w = contenido.querySelector('.docx-wrapper');
    if (w) w.style.zoom = z;
    lblZoom.textContent = `${Math.round(zoom * 100)} %`;
  }

  function ajustar() {
    const disponible = Math.max(200, hojas.clientWidth - 24);
    base = Math.min(1.5, disponible / anchoHoja());
    aplicar();
  }

  function fijarZoom(z) {
    zoom = Math.min(4, Math.max(0.4, z));
    aplicar();
  }

  document.getElementById('mas').onclick = () => fijarZoom(zoom * 1.2);
  document.getElementById('menos').onclick = () => fijarZoom(zoom / 1.2);
  document.getElementById('ajustar').onclick = () => fijarZoom(1);
  window.addEventListener('resize', ajustar);

  // Pellizcar para hacer zoom en el celular
  const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  let pinch = null;
  hojas.addEventListener('touchstart', (e) => { if (e.touches.length === 2) pinch = { d: dist(e.touches), z: zoom }; }, { passive: true });
  hojas.addEventListener('touchmove', (e) => { if (pinch && e.touches.length === 2) pinch.f = dist(e.touches) / pinch.d; }, { passive: true });
  hojas.addEventListener('touchend', () => { if (pinch && pinch.f) fijarZoom(pinch.z * pinch.f); pinch = null; });

  async function cargar() {
    if (!archivo) return error('No se indicó qué documento abrir.');
    let blob;
    try {
      const r = await fetch(archivo);
      if (!r.ok) throw new Error(r.status === 400 || r.status === 403 ? 'El enlace del documento venció. Vuelve a abrirlo desde la aplicación.' : `Error ${r.status}`);
      blob = await r.blob();
    } catch (e) {
      return error(e.message && e.message.startsWith('El enlace') ? e.message : 'No se pudo descargar el documento.');
    }
    try {
      await docx.renderAsync(blob, contenido, null, {
        className: 'docx',
        inWrapper: true,
        breakPages: true,
        ignoreLastRenderedPageBreak: false,
        renderHeaders: true,
        renderFooters: true,
        renderFootnotes: true,
        renderEndnotes: true,
        renderChanges: false,
        useBase64URL: true,
        experimental: true,
      });
    } catch (e) {
      console.error(e);
      return error('Este archivo de Word no se pudo mostrar aquí (los .doc antiguos no son compatibles). Prueba con el visor de Office o de Google, o descárgalo.');
    }
    estado.style.display = 'none';
    lblInfo.textContent = 'Vista de Word';
    ajustar();
  }

  cargar();
</script>
</body>
</html>
