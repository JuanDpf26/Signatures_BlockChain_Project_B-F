<!-- reCAPTCHA -->
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script>
    window.captchaToken = null;

    function onCaptchaVerified(token) {
      window.captchaToken = token;
      document.getElementById('recaptcha-overlay').style.display = 'none';
    }

    function onCaptchaExpired() {
      window.captchaToken = null;
    }

    function resetCaptcha() {
      if (typeof grecaptcha !== 'undefined') {
        grecaptcha.reset();
      }
      window.captchaToken = null;
    }

    function showCaptcha() {
      document.getElementById('recaptcha-overlay').style.display = 'flex';
    }
  </script>
</head>
<body>
  <!-- Overlay del captcha -->
  <div id="recaptcha-overlay" style="
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  ">
    <div style="
      background: #1a1a2e;
      padding: 32px;
      border-radius: 16px;
      border: 1px solid #2a2a4a;
      text-align: center;
    ">
      <p style="color: #e5e7eb; font-family: sans-serif; margin-bottom: 16px; font-size: 16px;">
        Verifica que no eres un robot
      </p>
      <div class="g-recaptcha"
        data-sitekey="6LdyI9YsAAAAAKZJH0KEvJhczWzJ8xB5t9T6NVpB"
        data-callback="onCaptchaVerified"
        data-expired-callback="onCaptchaExpired"
        data-theme="dark">
      </div>
      <button onclick="document.getElementById('recaptcha-overlay').style.display='none'"
        style="
          margin-top: 16px;
          background: transparent;
          border: 1px solid #4b5563;
          color: #9ca3af;
          padding: 8px 20px;
          border-radius: 8px;
          cursor: pointer;
          font-size: 14px;
        ">
        Cancelar
      </button>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
