name: Deploy Flutter Web to Vercel

# Despliegue automático PAUSADO mientras el proyecto se trabaja en local.
# Para publicar: GitHub → Actions → "Deploy Flutter Web to Vercel" → Run workflow.
# Para reactivarlo en cada push a main, descomenta las líneas de "push".
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # El pubspec pide Dart ^3.11: Flutter 3.24 ya no sirve, se usa el estable más reciente
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: |
          flutter build web --release \
            --dart-define=IS_LOCAL=false \
            --dart-define=API_URL=${{ secrets.API_URL }}

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: build/web
          vercel-args: '--prod'