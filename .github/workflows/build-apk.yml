name: Build APK (prueba)

# Genera el APK de Android y lo publica como "pre-release" en GitHub para
# descargarlo directamente desde el celular.
# GitHub → Actions → "Build APK (prueba)" → Run workflow.
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'URL del backend (vacío = secreto API_URL o https://blocksign-backend.onrender.com)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Llave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -z "$KEY_PASS" ]; then
            echo "::error::Existe ANDROID_KEYSTORE_BASE64 pero falta ANDROID_KEY_PASSWORD (revisa el nombre exacto del secreto)"
            exit 1
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Firmando con la llave fija de DocBlockSign"
          else
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: se firma con llave temporal (Google Sign-In no funcionará)"
          fi

      - name: Compilar APK
        env:
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_URL: ${{ inputs.api_url || secrets.API_URL || 'https://blocksign-backend.onrender.com' }}
        run: |
          echo "Backend: $API_URL"
          set -o pipefail
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=IS_LOCAL=false \
            --dart-define=API_URL=$API_URL 2>&1 | tee build.log || {
            # Deja las líneas del error como anotaciones (se ven en el resumen del run)
            grep -E "error|Error|ERROR|What went wrong|FAILURE|Exception|e: " build.log | grep -v "^\s*$" | tail -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }
          cp build/app/outputs/flutter-apk/app-release.apk DocBlockSign-prueba-${{ github.run_number }}.apk
          # APK más liviano solo para celulares modernos (arm64), casi todos los Android actuales
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --dart-define=IS_LOCAL=false --dart-define=API_URL=$API_URL
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk DocBlockSign-prueba-${{ github.run_number }}-arm64.apk

      - name: Huella SHA-1 del APK
        run: |
          AS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          SHA1=$($AS verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 "SHA-1" | awk '{print $NF}' | sed 's/../&:/g; s/:$//' | tr a-z A-Z)
          echo "::notice::SHA-1 del APK: $SHA1 (debe ser 4F:E0:E4:88:66:3E:84:F1:AE:F0:F4:97:7A:9A:DE:D4:17:64:1C:77)"

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BlockSign-apk
          path: DocBlockSign-prueba-${{ github.run_number }}*.apk

      - name: Publicar pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-prueba-${{ github.run_number }}
          name: DocBlockSign APK de prueba ${{ github.run_number }}
          prerelease: true
          body: |
            APK de prueba (firmado con llave de depuración).
            - **-arm64.apk**: más liviano, para casi todos los celulares Android actuales (recomendado).
            - El otro sirve para cualquier celular, pero pesa más.
            Para instalar: descárgalo en el celular y permite "Instalar apps desconocidas".
          files: DocBlockSign-prueba-${{ github.run_number }}*.apk
